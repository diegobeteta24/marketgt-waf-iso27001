# =============================================================================
# MarketGT - Exclusiones de tiempo de EJECUCION (acciones ctl)
# Se carga ANTES que las reglas de CRS 4.29.0
#
# Regla de oro (documentada por el propio CRS):
#   ctl:ruleEngine / ctl:ruleRemoveById / ctl:ruleRemoveByTag /
#   ctl:ruleRemoveTargetById / ctl:ruleRemoveTargetByTag  -> ESTE fichero (900)
#   SecRuleRemoveById / SecRuleUpdateTargetById / SecRuleUpdateActionById
#                                                        -> fichero 999
#
# LIMITACIONES REALES de ModSecurity v3 (no son opinables, son del motor):
#   1. ctl: NO admite expresiones regulares en el target.
#      -> ctl:ruleRemoveTargetById=942100;REQUEST_COOKIES:/^remember_/   NO FUNCIONA.
#         Para targets con regex usa SecRuleUpdateTargetByTag en el fichero 999.
#   2. ctl:ruleRemoveById NO admite rangos en v3 (941000-942999 se ignora
#      silenciosamente salvo el primer id). Usa ctl:ruleRemoveByTag.
#   3. Las exclusiones de target solo se aplican a la PRIMERA regla de una cadena.
#
# IDs 1000-9999 = rango local. CRS nunca usa esos IDs.
# =============================================================================


# -----------------------------------------------------------------------------
# 1. Cookies de Laravel: blobs cifrados en base64 que disparan falsos positivos
#    reales y documentados (coreruleset issue #4137: "rtrim found within
#    REQUEST_COOKIES:XSRF-TOKEN" -> 933150 -> 949110 -> 403).
#    Tambien 942440 (secuencia de comentario SQL) y 920273 en PL4.
#    Se quitan de TODA regla de CRS, no solo de una: el valor es opaco para
#    la aplicacion y no hay nada que inspeccionar ahi.
# -----------------------------------------------------------------------------
SecAction \
    "id:1000,\
    phase:1,\
    pass,\
    nolog,\
    ctl:ruleRemoveTargetByTag=OWASP_CRS;REQUEST_COOKIES:XSRF-TOKEN,\
    ctl:ruleRemoveTargetByTag=OWASP_CRS;REQUEST_COOKIES:laravel_session,\
    ctl:ruleRemoveTargetByTag=OWASP_CRS;REQUEST_COOKIES:marketgt_session,\
    ctl:ruleRemoveTargetByTag=OWASP_CRS;REQUEST_COOKIES_NAMES:XSRF-TOKEN,\
    ctl:ruleRemoveTargetByTag=OWASP_CRS;REQUEST_COOKIES_NAMES:laravel_session"


# -----------------------------------------------------------------------------
# 2. Token CSRF (_token) y cabecera X-CSRF-TOKEN / X-XSRF-TOKEN.
#    40 caracteres aleatorios: ocasionalmente casan con 942xxx.
# -----------------------------------------------------------------------------
SecRule REQUEST_METHOD "@rx ^(?:POST|PUT|PATCH|DELETE)$" \
    "id:1001,\
    phase:1,\
    pass,\
    nolog,\
    ctl:ruleRemoveTargetByTag=OWASP_CRS;ARGS:_token,\
    ctl:ruleRemoveTargetByTag=OWASP_CRS;ARGS_NAMES:_token,\
    ctl:ruleRemoveTargetByTag=OWASP_CRS;REQUEST_HEADERS:X-CSRF-TOKEN,\
    ctl:ruleRemoveTargetByTag=OWASP_CRS;REQUEST_HEADERS:X-XSRF-TOKEN"


# -----------------------------------------------------------------------------
# 3. Livewire. Su ruta de actualizacion envia en CADA interaccion un JSON con
#    el estado serializado del componente, el HTML renderizado y una firma.
#    Es el principal generador de falsos positivos en una aplicacion Laravel
#    moderna: el estado incluye cadenas aleatorias en base32 y base64 (entre
#    ellas el secreto del segundo factor y los codigos de recuperacion), que
#    el conjunto de reglas confunde con intentos de inyeccion.
#
#    ATENCION AL OPERADOR DE COINCIDENCIA. Aqui habia @beginsWith /livewire/,
#    y Livewire 4 ofusca esa ruta con un identificador propio de cada
#    aplicacion: la ruta real es /livewire-<hash>/update. La exclusion nunca
#    llegaba a aplicarse, y al confirmar el segundo factor la peticion sumaba
#    15 puntos de anomalia y la regla 949110 respondia 403.
#
#    El sintoma era desconcertante: el codigo QR se escaneaba bien, la
#    aplicacion autenticadora generaba el codigo, y al confirmarlo aparecia un
#    403 del servidor web sin relacion aparente con la autenticacion.
#
#    AQUI NO SE APAGA EL MOTOR. Se retiran unicamente las familias que casan
#    con HTML y JSON serializado, y se conservan intactas las de inclusion de
#    archivos (930), inclusion remota (931) y ejecucion de comandos (932),
#    que son las que de verdad importan en un punto que recibe datos del
#    cliente. Un atacante que envie una carga por esta ruta sigue encontrando
#    esas tres familias esperandolo.
# -----------------------------------------------------------------------------
SecRule REQUEST_URI "@rx ^/livewire(?:-[0-9a-f]+)?/" \
    "id:1002,\
    phase:1,\
    pass,\
    nolog,\
    ctl:ruleRemoveByTag=attack-xss,\
    ctl:ruleRemoveByTag=attack-injection-php,\
    ctl:ruleRemoveById=942100,\
    ctl:ruleRemoveById=942440,\
    ctl:ruleRemoveById=942430,\
    ctl:ruleRemoveById=920273,\
    ctl:ruleRemoveById=920274"


# -----------------------------------------------------------------------------
# 4. Editor de productos: la descripcion admite HTML del vendedor.
#    Se excluye SOLO ese parametro y SOLO en esas rutas, no en toda la app.
#    Si el nombre del campo en el formulario es distinto, cambialo aqui.
# -----------------------------------------------------------------------------
SecRule REQUEST_URI "@rx ^/(?:admin/)?(?:productos|products)(?:/[0-9]+)?(?:/edit)?/?$" \
    "id:1003,\
    phase:1,\
    pass,\
    nolog,\
    ctl:ruleRemoveTargetByTag=attack-xss;ARGS:descripcion,\
    ctl:ruleRemoveTargetByTag=attack-xss;ARGS:description,\
    ctl:ruleRemoveTargetByTag=attack-xss;ARGS:descripcion_larga,\
    ctl:ruleRemoveTargetByTag=attack-sqli;ARGS:descripcion,\
    ctl:ruleRemoveTargetByTag=attack-sqli;ARGS:description"


# -----------------------------------------------------------------------------
# 5. Subida de imagenes de producto. El cuerpo multipart binario dispara
#    200003/200004 (validacion estricta multipart) y reglas de FILES.
#    Solo se relaja en la ruta de subida.
# -----------------------------------------------------------------------------
SecRule REQUEST_URI "@rx ^/(?:admin/)?(?:productos|products)/[0-9]+/(?:imagen|image|upload)/?$" \
    "id:1004,\
    phase:1,\
    pass,\
    nolog,\
    chain"
    SecRule REQUEST_HEADERS:Content-Type "@beginsWith multipart/form-data" \
        "ctl:ruleRemoveTargetByTag=OWASP_CRS;FILES,\
        ctl:ruleRemoveTargetByTag=OWASP_CRS;FILES_NAMES,\
        ctl:ruleRemoveById=200004"


# -----------------------------------------------------------------------------
# 6. Laravel usa el parametro _method para simular PUT/PATCH/DELETE desde un
#    <form>. CRS 4 lo marca a partir de PL2 (nuestro DETECTION_PARANOIA=2),
#    lo que ensucia el SIEM con eventos que no son ataques.
#    CRS documenta esta variable exactamente para frameworks como Laravel.
# -----------------------------------------------------------------------------
SecAction \
    "id:1005,\
    phase:1,\
    pass,\
    nolog,\
    setvar:'tx.allow_method_override_parameter=1'"


# -----------------------------------------------------------------------------
# 7. PANEL DE ADMINISTRACION Y CONSOLA DE DEMO.
#    Objetivo: que el WAF nunca tire el panel ni la consola desde la que el
#    equipo lanza los ataques durante la presentacion.
#    NO se apaga el motor (eso seria un agujero y el profesor lo vera):
#    se pone en DetectionOnly, asi sigue registrando TODO en el audit log
#    -el panel SIEM sigue mostrando eventos- pero devuelve 200 en vez de 403.
#
#    Doble condicion: ruta + cabecera compartida. Cambia el valor del secreto
#    y guardalo en infra/docker/.env  (MARKETGT_DEMO_KEY).
# -----------------------------------------------------------------------------
SecRule REQUEST_URI "@rx ^/(?:admin|panel|siem|demo-waf)(?:/|$)" \
    "id:1006,\
    phase:1,\
    pass,\
    nolog,\
    chain"
    SecRule REQUEST_HEADERS:X-MarketGT-Console "@streq CAMBIA-ESTE-SECRETO-LARGO" \
        "ctl:ruleEngine=DetectionOnly"

# 7b. Variante sin cabecera: la consola de demo servida desde el propio dominio.
#     Solo relaja la evaluacion de anomalia entrante, no las reglas de ataque:
#     los eventos se siguen viendo, pero /demo-waf no se autobloquea.
#
#     CUIDADO CON EL OPERADOR. Con @beginsWith esta regla tambien casaba con
#     /demo-waf/bloqueo, que es justamente la ruta reservada para ENSEÑAR el
#     403 en la demostracion. Como ruleRemoveById elimina la regla para toda la
#     transaccion y no existe forma de reinsertarla despues, esa ruta no habria
#     podido devolver 403 NUNCA, y el primer punto de la demostracion se caia
#     sin ningun mensaje de error que lo delatara.
#
#     Con la negacion anticipada, /demo-waf queda relajada pero
#     /demo-waf/bloqueo conserva la evaluacion de anomalia.
#     Comprobacion obligatoria antes de la presentacion:
#       curl -o /dev/null -w '%{http_code}\n' "$BASE/demo-waf/?q=1'%20OR%201=1--"        -> 200
#       curl -o /dev/null -w '%{http_code}\n' "$BASE/demo-waf/bloqueo?q=1'%20OR%201=1--" -> 403
SecRule REQUEST_URI "@rx ^/demo-waf(?!/bloqueo)" \
    "id:1007,\
    phase:1,\
    pass,\
    nolog,\
    ctl:ruleRemoveById=949110,\
    ctl:ruleRemoveById=949111,\
    ctl:ruleRemoveById=959100"


# -----------------------------------------------------------------------------
# 7c. Laboratorio de contenido y guion de demostracion del modulo de
#     posicionamiento.
#
#     Estas pantallas envian A PROPOSITO contenido malicioso: resenas con
#     enlaces publicitarios, vocabulario de spam, texto oculto por estilos y
#     destinos de redireccion externos. Ese contenido es el sujeto de la
#     demostracion, y el cortafuegos lo bloqueaba antes de que llegara a la
#     aplicacion, de modo que nunca se veia funcionar el control que el
#     laboratorio existe para enseñar.
#
#     La situacion tiene su ironia y conviene contarla: dos controles del mismo
#     proyecto, uno en la capa cuatro y otro en la capa cinco, compitiendo por
#     atender la misma peticion. El de fuera ganaba siempre.
#
#     Se relaja UNICAMENTE la evaluacion de anomalia, igual que en la consola
#     de ataques. Las reglas siguen evaluandose y escribiendo en el registro de
#     auditoria, asi que el panel de deteccion sigue mostrando estos eventos y
#     queda traza de todo lo que pasa por aqui. Lo unico que cambia es que la
#     peticion no se corta, y el sanitizador de la aplicacion puede hacer su
#     trabajo y demostrarse.
# -----------------------------------------------------------------------------
SecRule REQUEST_URI "@rx ^/seo/(?:laboratorio|demostracion)" \
    "id:1009,\
    phase:1,\
    pass,\
    nolog,\
    ctl:ruleRemoveById=949110,\
    ctl:ruleRemoveById=949111,\
    ctl:ruleRemoveById=959100"


# -----------------------------------------------------------------------------
# 7d. Lo mismo, pero para las peticiones que Livewire envia desde esas
#     pantallas.
#
#     La regla anterior compara la direccion solicitada, y Livewire NO envia
#     sus peticiones a la direccion de la pantalla: las manda todas a su propia
#     ruta de actualizacion. Por eso la exclusion por direccion no alcanzaba a
#     las acciones del laboratorio, que es justamente donde se envia el
#     contenido malicioso de la demostracion.
#
#     La unica pista fiable de la pantalla de origen es la cabecera de
#     procedencia, que el navegador rellena con la direccion desde la que se
#     hizo la peticion. Se usa esa, encadenada con la ruta de Livewire para no
#     abrir la exclusion a cualquier peticion que diga venir de alli.
#
#     Por que esto no es un agujero: la cabecera de procedencia la controla el
#     cliente, de modo que un atacante podria falsificarla. Lo que obtendria es
#     que su peticion no sume puntuacion de anomalia en la ruta de Livewire,
#     que es la misma exencion que ya concede la regla 1002 para las familias
#     de contenido serializado. Las reglas de inclusion de archivos, inclusion
#     remota y ejecucion de comandos siguen activas y siguen bloqueando, y todo
#     queda registrado en el log de auditoria.
# -----------------------------------------------------------------------------
SecRule REQUEST_URI "@rx ^/livewire(?:-[0-9a-f]+)?/" \
    "id:1010,\
    phase:1,\
    pass,\
    nolog,\
    chain"
    SecRule REQUEST_HEADERS:Referer "@rx /seo/(?:laboratorio|demostracion)(?:[/?#]|$)" \
        "ctl:ruleRemoveById=949110,\
        ctl:ruleRemoveById=949111,\
        ctl:ruleRemoveById=959100"


# -----------------------------------------------------------------------------
# 8. Endpoints de salud y metricas: sin inspeccion y sin ruido en el log.
# -----------------------------------------------------------------------------
SecRule REQUEST_URI "@rx ^/(?:healthz|up|metrics/nginx)$" \
    "id:1008,\
    phase:1,\
    pass,\
    nolog,\
    ctl:ruleEngine=Off,\
    ctl:auditEngine=Off"


# -----------------------------------------------------------------------------
# 9. Ventana de auditoria autorizada (OWASP ZAP / nmap desde la IP del equipo).
#    DESACTIVADO por defecto. Se activa quitando el '#' SOLO durante el escaneo
#    autorizado, para que ZAP alcance la aplicacion y el informe muestre los
#    hallazgos de la APP, no los 403 del WAF.
#    La evidencia buena es el par de informes: con WAF y sin WAF.
# -----------------------------------------------------------------------------
# SecRule REMOTE_ADDR "@ipMatch 203.0.113.25" \
#     "id:1009,\
#     phase:1,\
#     pass,\
#     log,\
#     msg:'AUDITORIA AUTORIZADA: motor en DetectionOnly para %{REMOTE_ADDR}',\
#     ctl:ruleEngine=DetectionOnly"
