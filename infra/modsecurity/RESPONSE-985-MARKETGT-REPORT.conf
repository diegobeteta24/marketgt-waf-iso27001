# =============================================================================
# MarketGT - Reporte de puntuacion de anomalia HACIA EL AUDIT LOG
#
# POR QUE EXISTE ESTE FICHERO (esto cuesta horas de depuracion si no se sabe):
#   La regla 980170 de CRS es la que trae el desglose bonito de la puntuacion
#   ("Anomaly Scores: (Inbound Scores: blocking=10, ... SQLI=10, XSS=0 ...)"),
#   PERO lleva la accion `noauditlog`. Es decir: ese mensaje va al ERROR LOG de
#   nginx y NO al audit log JSON. Si tu panel SIEM solo lee audit.json, NUNCA
#   vas a ver el desglose por categoria y vas a pensar que el WAF no lo calcula.
#
#   Lo que SI llega al audit log JSON es el mensaje de la regla 949110:
#     "Inbound Anomaly Score Exceeded (Total Score: 10)"
#   ...que trae el total, pero no el desglose.
#
# SOLUCION: una regla propia en fase 5 que repite el desglose CON auditlog.
#   Va en un fichero que ordena DESPUES de RESPONSE-980-CORRELATION.conf
#   (980 < 985 < 999), porque necesita que 980099 ya haya combinado los scores.
#
# ALTERNATIVA de una linea, en el fichero 999:
#     SecRuleUpdateActionById 980170 "auditlog"
#   Funciona, pero toca una regla del CRS. Si algun dia falla el arranque de
#   nginx por esa directiva, esta de aqui sigue siendo la via segura.
# =============================================================================

# Solo escribe cuando hubo algo que contar: evita una linea por cada peticion.
SecRule TX:DETECTION_ANOMALY_SCORE "@gt 0" \
    "id:15091,\
    phase:5,\
    pass,\
    t:none,\
    log,\
    auditlog,\
    msg:'MarketGT WAF | entrante bloqueo=%{tx.blocking_inbound_anomaly_score} deteccion=%{tx.detection_inbound_anomaly_score} umbral=%{tx.inbound_anomaly_score_threshold} por_pl=%{tx.inbound_anomaly_score_pl1}-%{tx.inbound_anomaly_score_pl2}-%{tx.inbound_anomaly_score_pl3}-%{tx.inbound_anomaly_score_pl4} | saliente bloqueo=%{tx.blocking_outbound_anomaly_score} umbral=%{tx.outbound_anomaly_score_threshold} | SQLI=%{tx.sql_injection_score} XSS=%{tx.xss_score} LFI=%{tx.lfi_score} RFI=%{tx.rfi_score} RCE=%{tx.rce_score} PHPI=%{tx.php_injection_score} HTTP=%{tx.http_violation_score} SESION=%{tx.session_fixation_score} SEO=%{tx.marketgt_seo_score} TOTAL=%{tx.anomaly_score}',\
    tag:'reporting',\
    tag:'MARKETGT/SCORE',\
    ver:'MarketGT/1.0'"
