# =============================================================================
# MarketGT - Exclusiones de tiempo de ARRANQUE (directivas)
# Se carga DESPUES de todas las reglas de CRS 4.29.0, porque una directiva
# SecRuleRemoveById / SecRuleUpdateTargetById solo puede referirse a reglas
# que el motor YA leyo.
#
# Aqui van (y solo aqui) las exclusiones que necesitan EXPRESION REGULAR en el
# target, porque la accion ctl del fichero 900 no soporta regex.
# =============================================================================


# -----------------------------------------------------------------------------
# 1. Cookies de sesion "recordarme" de Laravel: remember_web_<sha1>.
#    El nombre lleva un hash, asi que solo se puede excluir con regex ->
#    obligatoriamente aqui, no en el fichero 900.
# -----------------------------------------------------------------------------
SecRuleUpdateTargetByTag "OWASP_CRS" "!REQUEST_COOKIES:/^remember_web_/"
SecRuleUpdateTargetByTag "OWASP_CRS" "!REQUEST_COOKIES_NAMES:/^remember_web_/"

# Cookie de sesion cuando APP_NAME cambia el prefijo (marketgt_session, etc.)
SecRuleUpdateTargetByTag "OWASP_CRS" "!REQUEST_COOKIES:/_session$/"


# -----------------------------------------------------------------------------
# 2. Campos de contrasena: nunca se inspeccionan por SQLi/XSS.
#    Una contrasena fuerte legitima ("O'Brien--2026!") dispara 942100/942440.
#    Ademas evita que la contrasena acabe escrita en claro en el audit log.
# -----------------------------------------------------------------------------
SecRuleUpdateTargetByTag "attack-sqli" "!ARGS:password"
SecRuleUpdateTargetByTag "attack-sqli" "!ARGS:password_confirmation"
SecRuleUpdateTargetByTag "attack-sqli" "!ARGS:current_password"
SecRuleUpdateTargetByTag "attack-xss"  "!ARGS:password"
SecRuleUpdateTargetByTag "attack-xss"  "!ARGS:password_confirmation"
SecRuleUpdateTargetByTag "attack-injection-php" "!ARGS:password"


# -----------------------------------------------------------------------------
# 3. Segundo factor. El codigo TOTP es numerico (no molesta), pero la respuesta
#    WebAuthn/passkey es un JSON con base64url largo (clientDataJSON,
#    authenticatorData, signature, attestationObject) que casa con 942440,
#    933150 y 941xxx con toda seguridad. Sin esto, el login con passkey de la
#    demo NO pasa.
# -----------------------------------------------------------------------------
SecRuleUpdateTargetByTag "OWASP_CRS" "!ARGS:credential"
SecRuleUpdateTargetByTag "OWASP_CRS" "!ARGS:publicKeyCredential"
SecRuleUpdateTargetByTag "OWASP_CRS" "!ARGS:attestationObject"
SecRuleUpdateTargetByTag "OWASP_CRS" "!ARGS:clientDataJSON"
SecRuleUpdateTargetByTag "OWASP_CRS" "!ARGS:authenticatorData"
SecRuleUpdateTargetByTag "OWASP_CRS" "!ARGS:signature"
SecRuleUpdateTargetByTag "OWASP_CRS" "!ARGS:userHandle"
SecRuleUpdateTargetByTag "OWASP_CRS" "!ARGS:rawId"
# Cuerpo JSON: con Content-Type application/json ModSecurity nombra los
# argumentos con la ruta del JSON (ARGS:json.response.clientDataJSON).
SecRuleUpdateTargetByTag "OWASP_CRS" "!ARGS:/^json\.response\./"
SecRuleUpdateTargetByTag "OWASP_CRS" "!ARGS:/clientDataJSON$/"
SecRuleUpdateTargetByTag "OWASP_CRS" "!ARGS:/attestationObject$/"


# -----------------------------------------------------------------------------
# 4. Payload de Livewire (snapshot + checksum firmados por el servidor).
# -----------------------------------------------------------------------------
SecRuleUpdateTargetByTag "OWASP_CRS" "!ARGS:/^components\..*\.snapshot$/"
SecRuleUpdateTargetByTag "OWASP_CRS" "!ARGS:/^_token$/"


# -----------------------------------------------------------------------------
# 5. Reglas que hay que desactivar por completo, con su justificacion escrita.
#    Cada linea comentada es una decision de riesgo aceptada: documentala en la
#    matriz ISO 27001 (A.8.26 Requisitos de seguridad de las aplicaciones).
#
#    920350 solo si el profesor va a abrir el sitio por IP en vez de por dominio.
#    Dejalo COMENTADO si entregas un dominio (recomendado).
# -----------------------------------------------------------------------------
# SecRuleRemoveById 920350   # "Host header is a numeric IP address"


# -----------------------------------------------------------------------------
# 6. Pagina de bloqueo. Por defecto CRS responde 403 con el cuerpo de nginx.
#    Esto redirige a una pagina propia que explica el bloqueo y muestra el
#    identificador de transaccion -- queda muy bien en la demo y es lo que pide
#    ISO 27001 A.8.28 (codificacion segura) sobre mensajes de error controlados.
#    DEJALO COMENTADO si quieres demostrar el 403 limpio ante el profesor.
# -----------------------------------------------------------------------------
# SecRuleUpdateActionById 949110 "t:none,deny,status:403"
# SecRuleUpdateActionById 959100 "t:none,deny,status:403"


# -----------------------------------------------------------------------------
# 7. Endurecimiento propio del proyecto: subir a severidad de bloqueo la
#    deteccion de escaner cuando NO estamos en ventana de auditoria.
#    (913100 ya bloquea en PL1; esta linea solo deja constancia explicita.)
# -----------------------------------------------------------------------------
# SecRuleUpdateActionById 913100 "t:none,deny,status:403"
