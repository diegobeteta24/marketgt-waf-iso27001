# =============================================================================
# MarketGT - Reglas propias contra ATAQUES DE SEO
# (SEO spam injection / pharma hack / japanese keyword hack / cloaking /
#  open redirect / envenenamiento de robots-sitemap-canonical / negative SEO)
#
# POR QUE ESTE FICHERO EXISTE
#   OWASP CRS 4.29 NO trae reglas de SEO y no existe plugin oficial de SEO.
#   CRS cubre la VIA de entrada (XSS 941xxx, SQLi 942xxx, RFI 931xxx), pero no
#   el OBJETIVO del atacante de SEO. Estas reglas son del equipo: demuestran
#   que sabemos escribir SecRule, no solo encender un producto.
#
# ORDEN DE CARGA (critico)
#   El nombre tiene que ordenarse DESPUES de REQUEST-944 y ANTES de
#   REQUEST-949-BLOCKING-EVALUATION.conf, porque 949110 es quien evalua el
#   score de anomalia. Por eso el fichero se llama REQUEST-945-*.
#   La regla de fase 4 (15085) si llega a tiempo para RESPONSE-959 porque
#   "REQUEST-*" ordena antes que "RESPONSE-*" ('Q' < 'S').
#
# IDs 15000-15099 = rango local del proyecto (ModSecurity reserva 1-99999 para
#   reglas locales; CRS usa 900000-999999, asi que no hay colision posible).
#
# PUNTUACION CRS:  critical=5  error=4  warning=3  notice=2
#   Umbral entrante ANOMALY_INBOUND=5  ->  un solo CRITICAL ya devuelve 403.
#   Umbral saliente ANOMALY_OUTBOUND=4 ->  un solo CRITICAL saliente bloquea.
#
# DEPENDENCIA: /etc/modsecurity.d/owasp-crs/rules/marketgt-good-bots.data
#   (617 CIDR oficiales de Google y Bing). Si ese fichero no esta montado,
#   NGINX NO ARRANCA. Se regenera con infra/scripts/actualizar-ips-crawlers.sh
# =============================================================================

# -----------------------------------------------------------------------------
# SecDefaultAction: imprescindible y casi siempre olvidado.
# Cada fichero de CRS declara el suyo; si no lo hacemos, nuestras reglas heredan
# el del ULTIMO fichero cargado y una regla de fase 1 puede acabar con una
# accion disruptiva heredada de fase 2. Con `pass` aqui, ninguna regla nuestra
# bloquea por si sola: solo suma al score y 949110 decide. Es el modelo CRS.
# -----------------------------------------------------------------------------
SecDefaultAction "phase:1,log,auditlog,pass"
SecDefaultAction "phase:2,log,auditlog,pass"


# -----------------------------------------------------------------------------
# 15000 - Inicializa contadores para que el reporte de RESPONSE-985 nunca
#         imprima un valor vacio y para que TX:MARKETGT_BOT_VERIFICADO exista.
# -----------------------------------------------------------------------------
SecAction \
    "id:15000,\
    phase:1,\
    pass,\
    nolog,\
    setvar:'tx.marketgt_seo_score=0',\
    setvar:'tx.marketgt_bot_verificado=0'"


# #############################################################################
# BLOQUE A - CLOAKING Y CRAWLERS FALSIFICADOS
# #############################################################################
#
# El cloaking consiste en servir contenido distinto al buscador que al usuario.
# Para hacerlo, el atacante primero PRUEBA el sitio haciendose pasar por
# Googlebot. Detectar el Googlebot falso es el primer paso de la deteccion.
#
# La verificacion correcta (rDNS + DNS directo, FCrDNS) NO se puede hacer dentro
# de ModSecurity v3: el operador @rbl no resuelve PTR y libmodsecurity no
# permite consultas DNS sincronas por regla. Aqui hacemos la aproximacion por
# rango IP publicado (el propio Google la documenta como metodo valido a gran
# escala) y la verificacion FCrDNS completa la hace la aplicacion
# (infra/laravel-seo/VerificadorCrawler.php).
# -----------------------------------------------------------------------------

# 15020 - SELLO DE BOT LEGITIMO. No bloquea nada: solo marca la transaccion.
#         Se ejecuta ANTES que 15021 por orden de id dentro de la misma fase.
SecRule REQUEST_HEADERS:User-Agent "@rx (?i)(?:googlebot|storebot-google|google-inspectiontool|googleother|google-extended|bingbot|adidxbot|microsoftpreview)" \
    "id:15020,\
    phase:1,\
    pass,\
    nolog,\
    t:none,\
    ver:'MarketGT/1.1',\
    chain"
    SecRule REMOTE_ADDR "@ipMatchFromFile /etc/modsecurity.d/owasp-crs/rules/marketgt-good-bots.data" \
        "setvar:'tx.marketgt_bot_verificado=1'"

# -----------------------------------------------------------------------------
# 15021 - CLOAKING / BOT FALSO: alguien dice ser Googlebot o Bingbot desde una
#         IP que NO esta en las listas oficiales.
#
#         Rangos verificados el 2026-09-21 contra:
#           developers.google.com/static/crawling/ipranges/common-crawlers.json
#           developers.google.com/static/crawling/ipranges/special-crawlers.json
#           www.bing.com/toolbox/bingbot.json
#
#         OJO, ERROR CLASICO: la lista "66.249.64.0/19" que circula en blogs YA
#         NO ES SUFICIENTE. Google publica hoy tambien 192.178.4.0/24-ish y
#         decenas de rangos 34.x. Con la lista vieja, el Googlebot REAL acaba
#         recibiendo 403 y el sitio se desindexa: el falso positivo es peor que
#         el ataque. Por eso usamos @ipMatchFromFile sobre el fichero generado.
# -----------------------------------------------------------------------------
SecRule REQUEST_HEADERS:User-Agent "@rx (?i)(?:googlebot|storebot-google|google-inspectiontool|googleother|bingbot|adidxbot)" \
    "id:15021,\
    phase:1,\
    block,\
    capture,\
    t:none,\
    msg:'Cloaking / Crawler falsificado: User-Agent de buscador desde IP que no pertenece a Google ni a Bing',\
    logdata:'UA declarado: %{TX.0} | IP real: %{REMOTE_ADDR}',\
    tag:'application-multi',\
    tag:'attack-seo',\
    tag:'attack-reputation-scanner',\
    tag:'MARKETGT/SEO-CLOAKING',\
    tag:'paranoia-level/1',\
    tag:'iso27001/A.8.16',\
    tag:'owasp-top10-2025/A02',\
    ver:'MarketGT/1.1',\
    severity:'CRITICAL',\
    chain"
    SecRule TX:MARKETGT_BOT_VERIFICADO "@eq 0" \
        "setvar:'tx.inbound_anomaly_score_pl1=+%{tx.critical_anomaly_score}',\
        setvar:'tx.marketgt_seo_score=+%{tx.critical_anomaly_score}'"

# -----------------------------------------------------------------------------
# 15022 - Otros crawlers declarados (Yandex, Baidu, Petal, Amazon, Apple y las
#         aranas de herramientas SEO). NO tenemos su lista oficial de IPs, asi
#         que NO los tratamos como falsos: solo NOTICE (+2), que por si solo no
#         llega al umbral de 5. Es la diferencia entre un WAF afinado y uno que
#         bloquea a ciegas.
# -----------------------------------------------------------------------------
SecRule REQUEST_HEADERS:User-Agent "@rx (?i)(?:yandex(?:bot|images)|baiduspider|petalbot|amazonbot|applebot|semrushbot|ahrefsbot|mj12bot|dotbot|blexbot|serpstatbot|dataforseobot)" \
    "id:15022,\
    phase:1,\
    pass,\
    capture,\
    t:none,\
    msg:'Crawler de terceros o de herramienta SEO declarado (sin lista de IP verificable)',\
    logdata:'UA: %{TX.0} | IP: %{REMOTE_ADDR}',\
    tag:'application-multi',\
    tag:'attack-seo',\
    tag:'MARKETGT/SEO-CRAWLER-TERCERO',\
    ver:'MarketGT/1.1',\
    severity:'NOTICE',\
    setvar:'tx.marketgt_seo_score=+%{tx.notice_anomaly_score}'"

# -----------------------------------------------------------------------------
# 15023 - CLOAKING POR PARAMETRO: el atacante intenta forzar la "vista de
#         buscador" de la aplicacion para comparar ambas versiones.
#         (_escaped_fragment_ es la firma historica del cloaking AJAX.)
# -----------------------------------------------------------------------------
SecRule ARGS_NAMES "@rx (?i)^(?:_escaped_fragment_|googlebot|__cloak|render_for_bot|is_crawler|prerender|_prerender)$" \
    "id:15023,\
    phase:2,\
    block,\
    capture,\
    t:none,t:lowercase,\
    msg:'Cloaking: parametro de renderizado para buscador',\
    logdata:'Parametro: %{TX.0}',\
    tag:'application-multi',\
    tag:'attack-seo',\
    tag:'MARKETGT/SEO-CLOAKING',\
    tag:'paranoia-level/1',\
    ver:'MarketGT/1.1',\
    severity:'WARNING',\
    setvar:'tx.inbound_anomaly_score_pl1=+%{tx.warning_anomaly_score}',\
    setvar:'tx.marketgt_seo_score=+%{tx.warning_anomaly_score}'"


# #############################################################################
# BLOQUE B - SEO SPAM INJECTION (pharma hack / japanese keyword hack)
# #############################################################################
#
# El atacante NO quiere tu servidor: quiere tu PageRank. Mete enlaces a su
# tienda de replicas dentro de una resena, una descripcion de producto o un
# campo de perfil, y espera a que Googlebot los indexe desde tu dominio.
# Via de entrada tipica: XSS almacenado, IDOR sobre un recurso ajeno o
# simplemente falta de validacion en un campo publico.
# -----------------------------------------------------------------------------

# 15030 - Enlace o marcado de enlace inyectado en un campo de contenido.
#         Cubre HTML (<a href>), BBCode ([url=]), Markdown ([txt](http...)) y
#         los TLD de spam habituales. CRITICAL: un acierto = 403.
SecRule ARGS:descripcion|ARGS:description|ARGS:comentario|ARGS:comment|ARGS:resena|ARGS:review|ARGS:opinion|ARGS:bio|ARGS:mensaje|ARGS:message|ARGS:nombre_tienda|ARGS:about|ARGS:firma \
    "@rx (?i)(?:<a\s[^>]*href\s*=|\[url\s*[=\]]|\]\(\s*https?://|<iframe|<link\s|https?://[^\s\"'<>]+\.(?:ru|top|xyz|cn|tk|click|loan|icu|buzz|gq|cf|ml|work|zip|mom)\b)" \
    "id:15030,\
    phase:2,\
    block,\
    capture,\
    t:none,t:urlDecodeUni,t:htmlEntityDecode,t:jsDecode,t:lowercase,\
    msg:'SEO Spam Injection: enlace externo inyectado en campo de contenido publicable',\
    logdata:'Coincidencia: %{TX.0} en %{MATCHED_VAR_NAME}',\
    tag:'application-multi',\
    tag:'attack-seo',\
    tag:'MARKETGT/SEO-SPAM',\
    tag:'paranoia-level/1',\
    tag:'iso27001/A.8.28',\
    tag:'owasp-top10-2025/A05',\
    ver:'MarketGT/1.1',\
    severity:'CRITICAL',\
    multiMatch,\
    setvar:'tx.inbound_anomaly_score_pl1=+%{tx.critical_anomaly_score}',\
    setvar:'tx.marketgt_seo_score=+%{tx.critical_anomaly_score}'"

# -----------------------------------------------------------------------------
# 15031 - SEO POISONING: vocabulario clasico del pharma hack y del spam de
#         replicas/casino/cracks colocado en contenido indexable.
#         t:removeWhitespace neutraliza el truco "v i a g r a".
# -----------------------------------------------------------------------------
SecRule ARGS|REQUEST_HEADERS:Referer \
    "@rx (?i)\b(?:buy(?:cheap)?(?:viagra|cialis|levitra|tramadol|oxycodone|xanax)|(?:viagra|cialis)(?:online|sinreceta)|casino(?:online|bonus)|freedownloadcrack|(?:crack|keygen|serial)(?:download|gratis)|replica(?:rolex|watches|handbags)|comprarseguidores|backlinks?(?:baratos|gratis)|payday(?:loan|advance))\b" \
    "id:15031,\
    phase:2,\
    block,\
    capture,\
    t:none,t:urlDecodeUni,t:htmlEntityDecode,t:lowercase,t:removeWhitespace,\
    msg:'SEO Poisoning: vocabulario de spam farmaceutico o de pirateria en contenido indexable',\
    logdata:'Coincidencia: %{TX.0} en %{MATCHED_VAR_NAME}',\
    tag:'application-multi',\
    tag:'attack-seo',\
    tag:'MARKETGT/SEO-POISONING',\
    tag:'paranoia-level/1',\
    tag:'iso27001/A.8.28',\
    ver:'MarketGT/1.1',\
    severity:'CRITICAL',\
    multiMatch,\
    setvar:'tx.inbound_anomaly_score_pl1=+%{tx.critical_anomaly_score}',\
    setvar:'tx.marketgt_seo_score=+%{tx.critical_anomaly_score}'"

# -----------------------------------------------------------------------------
# 15032 - JAPANESE KEYWORD HACK: el ataque inserta texto CJK (japones) en una
#         tienda escrita integramente en espanol. Detectamos rangos Unicode
#         Hiragana/Katakana/Han en campos que en MarketGT son siempre latinos.
#
#         DELIBERADAMENTE ACOTADO a campos concretos y con severidad WARNING
#         (+3, no bloquea solo): si manana MarketGT vende manga, un nombre de
#         producto en japones es legitimo. Una regla de SEO que bloquea idiomas
#         es una regla mal hecha. Aqui ALERTA, no censura.
#
#         SOBRE EL PATRON: esta escrito en BYTES UTF-8, no con \x{...}.
#         Un patron \x{3040} exige que PCRE2 este en modo UTF; si no lo esta, la
#         expresion NO COMPILA y NGINX NO ARRANCA. El sabado eso significa la
#         tienda caida. En bytes crudos el patron compila siempre:
#             \xe3\x8[0-3][\x80-\xbf]        -> U+3000-U+3FFF (Hiragana, Katakana)
#             [\xe4-\xe9][\x80-\xbf][\x80-\xbf] -> U+4000-U+9FFF (ideogramas Han)
#         Exigir 3 caracteres seguidos deja el falso positivo en practicamente
#         cero para una tienda escrita en espanol.
# -----------------------------------------------------------------------------
SecRule ARGS:descripcion|ARGS:comentario|ARGS:resena|ARGS:review|ARGS:bio|ARGS:slug|ARGS:meta_title|ARGS:meta_description \
    "@rx (?:\xe3\x8[0-3][\x80-\xbf]|[\xe4-\xe9][\x80-\xbf][\x80-\xbf]){3,}" \
    "id:15032,\
    phase:2,\
    block,\
    capture,\
    t:none,t:urlDecodeUni,t:htmlEntityDecode,\
    msg:'Japanese Keyword Hack: texto CJK inyectado en campo de contenido de una tienda en espanol',\
    logdata:'Coincidencia en %{MATCHED_VAR_NAME}',\
    tag:'application-multi',\
    tag:'attack-seo',\
    tag:'MARKETGT/SEO-JAPANESE-KEYWORD',\
    tag:'paranoia-level/1',\
    ver:'MarketGT/1.1',\
    severity:'WARNING',\
    setvar:'tx.inbound_anomaly_score_pl1=+%{tx.warning_anomaly_score}',\
    setvar:'tx.marketgt_seo_score=+%{tx.warning_anomaly_score}'"

# -----------------------------------------------------------------------------
# 15033 - TEXTO OCULTO / ENLACES INVISIBLES: el spam que el usuario no ve pero
#         Googlebot si. Es la firma del "cloaked keywords and links hack".
# -----------------------------------------------------------------------------
SecRule ARGS \
    "@rx (?i)(?:display\s*:\s*none|visibility\s*:\s*hidden|font-size\s*:\s*0[^0-9.]|text-indent\s*:\s*-\s*[0-9]{3,}|position\s*:\s*absolute\s*;?\s*(?:left|top)\s*:\s*-\s*[0-9]{3,}|opacity\s*:\s*0(?:\.0+)?\s*[;\"']|height\s*:\s*[01]px\s*;\s*overflow\s*:\s*hidden)" \
    "id:15033,\
    phase:2,\
    block,\
    capture,\
    t:none,t:urlDecodeUni,t:htmlEntityDecode,t:cssDecode,t:lowercase,\
    msg:'SEO Spam: CSS de ocultamiento (texto o enlaces invisibles al usuario, visibles al crawler)',\
    logdata:'Coincidencia: %{TX.0} en %{MATCHED_VAR_NAME}',\
    tag:'application-multi',\
    tag:'attack-seo',\
    tag:'MARKETGT/SEO-HIDDEN-TEXT',\
    tag:'paranoia-level/1',\
    ver:'MarketGT/1.1',\
    severity:'CRITICAL',\
    multiMatch,\
    setvar:'tx.inbound_anomaly_score_pl1=+%{tx.critical_anomaly_score}',\
    setvar:'tx.marketgt_seo_score=+%{tx.critical_anomaly_score}'"

# -----------------------------------------------------------------------------
# 15034 - INYECCION DE METADATOS DE INDEXACION: <meta name=robots>,
#         <link rel=canonical>, <base href>, og:url. Con un canonical inyectado
#         el atacante le dice a Google "la version buena de esta pagina esta en
#         mi dominio" y te roba el posicionamiento sin tocar tu contenido.
# -----------------------------------------------------------------------------
SecRule ARGS \
    "@rx (?i)<\s*(?:meta\s[^>]*name\s*=\s*[\"']?(?:robots|googlebot)|link\s[^>]*rel\s*=\s*[\"']?(?:canonical|alternate|amphtml)|base\s[^>]*href|meta\s[^>]*property\s*=\s*[\"']?og:url)" \
    "id:15034,\
    phase:2,\
    block,\
    capture,\
    t:none,t:urlDecodeUni,t:htmlEntityDecode,t:lowercase,\
    msg:'Negative SEO: inyeccion de metadatos de indexacion (canonical / meta robots / base href)',\
    logdata:'Coincidencia: %{TX.0} en %{MATCHED_VAR_NAME}',\
    tag:'application-multi',\
    tag:'attack-seo',\
    tag:'MARKETGT/SEO-META-INJECTION',\
    tag:'paranoia-level/1',\
    tag:'owasp-top10-2025/A05',\
    ver:'MarketGT/1.1',\
    severity:'CRITICAL',\
    multiMatch,\
    setvar:'tx.inbound_anomaly_score_pl1=+%{tx.critical_anomaly_score}',\
    setvar:'tx.marketgt_seo_score=+%{tx.critical_anomaly_score}'"


# #############################################################################
# BLOQUE C - OPEN REDIRECT (doorway links con tu dominio de fachada)
# #############################################################################
#
# El enlace que la victima ve es https://marketgt.gt/ir?url=... y el dominio en
# el que aterriza es otro. Sirve para phishing y para construir doorway pages
# que heredan la reputacion de tu dominio.
#
# COBERTURA DE CRS: 931110 (nombre de parametro tipico + payload URL) y 931130
# (referencia fuera de dominio) se acercan, PERO 931130 es paranoia-level/2 y
# esta instalacion corre BLOCKING_PARANOIA=1: en PL2 solo DETECTA, no bloquea.
# Nuestra 15040 si bloquea en PL1 y ademas cubre los bypass que 931130 no ve:
#   //evil.tld   /\evil.tld   \/\/evil.tld   https:/\evil.tld
#   https://marketgt.gt@evil.tld   (userinfo: el host real es evil.tld)
#   %2f%2fevil.tld  (doble codificacion)
# -----------------------------------------------------------------------------

# 15040 - Destino de redireccion fuera del propio Host.
#   El grupo 1 captura el HOST del destino y se compara con el Host de la
#   peticion (misma tecnica que usa CRS en 931130). Asi la regla funciona igual
#   en localhost, en el tunel de Cloudflare y en el dominio final: NO hay que
#   editar el dominio a mano en ningun sitio.
SecRule ARGS:redirect|ARGS:redirect_to|ARGS:redirect_uri|ARGS:redirectUrl|ARGS:next|ARGS:url|ARGS:u|ARGS:return|ARGS:return_url|ARGS:returnUrl|ARGS:continue|ARGS:destino|ARGS:destination|ARGS:dest|ARGS:goto|ARGS:target|ARGS:redir|ARGS:back|ARGS:callback|ARGS:ir|ARGS:salir|ARGS:out \
    "@rx (?i)^(?:[a-z][a-z0-9+.\-]*:)?(?:[/\x5c]|%2f|%5c){2}(?:[^/\x5c?#]*@)?([a-z0-9._\-]+)" \
    "id:15040,\
    phase:2,\
    block,\
    capture,\
    t:none,t:urlDecodeUni,t:removeNulls,t:removeWhitespace,t:lowercase,\
    msg:'Open Redirect: destino de redireccion fuera del dominio propio',\
    logdata:'Host destino: %{TX.1} | Host de la peticion: %{request_headers.host} | Valor: %{MATCHED_VAR}',\
    tag:'application-multi',\
    tag:'attack-seo',\
    tag:'MARKETGT/SEO-OPEN-REDIRECT',\
    tag:'paranoia-level/1',\
    tag:'iso27001/A.8.26',\
    tag:'owasp-top10-2025/A01',\
    ver:'MarketGT/1.1',\
    severity:'CRITICAL',\
    chain"
    SecRule TX:1 "!@endsWith %{request_headers.host}" \
        "setvar:'tx.inbound_anomaly_score_pl1=+%{tx.critical_anomaly_score}',\
        setvar:'tx.marketgt_seo_score=+%{tx.critical_anomaly_score}'"

# -----------------------------------------------------------------------------
# 15041 - Esquema peligroso en un parametro de redireccion. javascript: y data:
#         nunca son un destino legitimo; no hace falta comparar dominios.
# -----------------------------------------------------------------------------
SecRule ARGS:redirect|ARGS:redirect_to|ARGS:redirect_uri|ARGS:next|ARGS:url|ARGS:u|ARGS:return|ARGS:returnUrl|ARGS:continue|ARGS:destino|ARGS:destination|ARGS:goto|ARGS:target|ARGS:redir|ARGS:back|ARGS:ir \
    "@rx (?i)^(?:javascript|data|vbscript|file|jar|blob|about):" \
    "id:15041,\
    phase:2,\
    block,\
    capture,\
    t:none,t:urlDecodeUni,t:removeNulls,t:removeWhitespace,t:htmlEntityDecode,t:jsDecode,t:lowercase,\
    msg:'Open Redirect con esquema peligroso (javascript:/data:) en parametro de redireccion',\
    logdata:'Esquema: %{TX.0} en %{MATCHED_VAR_NAME}',\
    tag:'application-multi',\
    tag:'attack-seo',\
    tag:'attack-xss',\
    tag:'MARKETGT/SEO-OPEN-REDIRECT',\
    tag:'paranoia-level/1',\
    ver:'MarketGT/1.1',\
    severity:'CRITICAL',\
    setvar:'tx.inbound_anomaly_score_pl1=+%{tx.critical_anomaly_score}',\
    setvar:'tx.marketgt_seo_score=+%{tx.critical_anomaly_score}'"


# #############################################################################
# BLOQUE D - INTEGRIDAD DE LOS ARTEFACTOS DE INDEXACION
# #############################################################################

# 15050 - Nadie escribe sobre robots.txt, sitemap.xml ni ads.txt por HTTP.
#         GET queda permitido (Googlebot tiene que poder leerlos).
#         .well-known/ se excluye a proposito: ACME de Let's Encrypt lo usa y no
#         queremos arriesgar la renovacion del certificado.
SecRule REQUEST_FILENAME "@rx (?i)^/(?:robots\.txt|sitemap[^/]*\.xml(?:\.gz)?|sitemap[^/]*\.txt|ads\.txt|app-ads\.txt|humans\.txt|llms\.txt)$" \
    "id:15050,\
    phase:2,\
    block,\
    t:none,t:urlDecodeUni,t:normalizePath,\
    msg:'Negative SEO: intento de escritura sobre artefactos de indexacion',\
    logdata:'%{REQUEST_METHOD} %{REQUEST_URI} desde %{REMOTE_ADDR}',\
    tag:'application-multi',\
    tag:'attack-seo',\
    tag:'MARKETGT/SEO-INDEXING-TAMPER',\
    tag:'paranoia-level/1',\
    tag:'iso27001/A.8.9',\
    tag:'owasp-top10-2025/A08',\
    ver:'MarketGT/1.1',\
    severity:'CRITICAL',\
    chain"
    SecRule REQUEST_METHOD "@rx ^(?:POST|PUT|PATCH|DELETE)$" \
        "setvar:'tx.inbound_anomaly_score_pl1=+%{tx.critical_anomaly_score}',\
        setvar:'tx.marketgt_seo_score=+%{tx.critical_anomaly_score}'"

# -----------------------------------------------------------------------------
# 15051 - Parametro de la aplicacion que apunta a robots.txt o sitemap.xml:
#         senal de un endpoint de edicion de SEO expuesto (o de un IDOR).
# -----------------------------------------------------------------------------
SecRule ARGS "@rx (?i)(?:robots\.txt|sitemap[^/\s]*\.xml|ads\.txt)" \
    "id:15051,\
    phase:2,\
    block,\
    capture,\
    t:none,t:urlDecodeUni,t:normalizePath,t:lowercase,\
    msg:'Negative SEO: artefacto de indexacion referenciado desde un parametro de la aplicacion',\
    logdata:'Coincidencia: %{TX.0} en %{MATCHED_VAR_NAME}',\
    tag:'application-multi',\
    tag:'attack-seo',\
    tag:'MARKETGT/SEO-INDEXING-TAMPER',\
    tag:'paranoia-level/1',\
    ver:'MarketGT/1.1',\
    severity:'WARNING',\
    setvar:'tx.inbound_anomaly_score_pl1=+%{tx.warning_anomaly_score}',\
    setvar:'tx.marketgt_seo_score=+%{tx.warning_anomaly_score}'"


# #############################################################################
# BLOQUE E - ENVENENAMIENTO DE LA BUSQUEDA INTERNA Y HOTLINKING
# #############################################################################

# 15060 - SEARCH RESULTS POISONING. El atacante busca "<h1>compra viagra</h1>"
#         en tu buscador interno; la pagina de resultados refleja el termino,
#         Googlebot la indexa y tu dominio aparece en Google con ese texto.
#         El control definitivo es <meta name="robots" content="noindex"> en la
#         pagina de resultados (lo hace la app); esta regla lo DETECTA.
SecRule ARGS:buscar|ARGS:q|ARGS:query|ARGS:s|ARGS:search|ARGS:termino|ARGS:keyword|ARGS:palabra \
    "@rx (?i)(?:<[a-z!/]|https?://|\[url|&#x?[0-9a-f]{2,};|\b(?:viagra|cialis|casino|replica|crack)\b)" \
    "id:15060,\
    phase:2,\
    block,\
    capture,\
    t:none,t:urlDecodeUni,t:htmlEntityDecode,t:lowercase,\
    msg:'Search Results Poisoning: HTML, enlace o spam en el termino de busqueda interna',\
    logdata:'Coincidencia: %{TX.0} en %{MATCHED_VAR_NAME}',\
    tag:'application-multi',\
    tag:'attack-seo',\
    tag:'MARKETGT/SEO-SEARCH-POISONING',\
    tag:'paranoia-level/1',\
    ver:'MarketGT/1.1',\
    severity:'ERROR',\
    multiMatch,\
    setvar:'tx.inbound_anomaly_score_pl1=+%{tx.error_anomaly_score}',\
    setvar:'tx.marketgt_seo_score=+%{tx.error_anomaly_score}'"

# -----------------------------------------------------------------------------
# 15061 - HOTLINKING: un tercero sirve tus imagenes desde su web. Le regala a el
#         el contenido y a ti la factura de ancho de banda; ademas Google puede
#         considerar su pagina como la fuente de la imagen.
#         Solo NOTICE: un Referer externo tambien aparece en agregadores
#         legitimos y en clientes de correo. Se usa para MEDIR, no para romper.
# -----------------------------------------------------------------------------
SecRule REQUEST_FILENAME "@rx (?i)\.(?:jpe?g|png|gif|webp|avif|svg|mp4|webm|pdf)$" \
    "id:15061,\
    phase:2,\
    pass,\
    t:none,t:urlDecodeUni,t:normalizePath,\
    msg:'Hotlinking: recurso estatico solicitado con Referer de un dominio ajeno',\
    logdata:'Recurso: %{REQUEST_FILENAME} | Referer: %{request_headers.referer}',\
    tag:'application-multi',\
    tag:'attack-seo',\
    tag:'MARKETGT/SEO-HOTLINKING',\
    ver:'MarketGT/1.1',\
    severity:'NOTICE',\
    chain"
    SecRule REQUEST_HEADERS:Referer "@rx ^https?://([^/]+)" \
        "capture,chain"
        SecRule TX:1 "!@streq %{request_headers.host}" \
            "setvar:'tx.marketgt_seo_score=+%{tx.notice_anomaly_score}'"


# #############################################################################
# BLOQUE F - DETECCION SALIENTE: la prueba de que el hack YA ocurrio
# #############################################################################
#
# Todo lo anterior es entrante: intenta impedir que el spam ENTRE. Esta regla es
# la otra mitad y casi nadie la pone: mira lo que SALE. Si una pagina de
# MarketGT ya contiene spam farmaceutico (porque entro por otra via: acceso
# directo a la base de datos, un respaldo restaurado, un commit malicioso),
# esta regla lo ve al servirla y la corta antes de que Googlebot la indexe.
#
# Es literalmente el vertice de DETECCION del Triangulo de la Ciberresiliencia
# aplicado al SEO. Requiere MODSEC_RESP_BODY_ACCESS=On (ya esta en el compose).
# -----------------------------------------------------------------------------
SecRule RESPONSE_BODY \
    "@rx (?i)(?:\b(?:buy\s+(?:cheap\s+)?(?:viagra|cialis|tramadol)|replica\s+(?:rolex|watches)|casino\s+online|payday\s+loan)\b|<a[^>]+href=[\"']?https?://[^\"'>]*\.(?:ru|top|xyz|tk|icu|buzz)[\"'/> ])" \
    "id:15085,\
    phase:4,\
    block,\
    capture,\
    t:none,\
    msg:'SEO Spam SALIENTE: la pagina servida ya contiene contenido de spam. El sitio esta comprometido.',\
    logdata:'Coincidencia: %{TX.0} | URI: %{REQUEST_URI}',\
    tag:'application-multi',\
    tag:'attack-seo',\
    tag:'attack-disclosure',\
    tag:'MARKETGT/SEO-SPAM-SALIENTE',\
    tag:'iso27001/A.8.16',\
    tag:'owasp-top10-2025/A08',\
    ver:'MarketGT/1.1',\
    severity:'CRITICAL',\
    setvar:'tx.outbound_anomaly_score_pl1=+%{tx.critical_anomaly_score}',\
    setvar:'tx.marketgt_seo_score=+%{tx.critical_anomaly_score}'"


# -----------------------------------------------------------------------------
# 15090 - Resumen para el SIEM. Deja el score de SEO en el audit log JSON de
#         toda transaccion que haya disparado alguna regla de este fichero.
#         Se lee con:
#           jq 'select(.transaction.messages[]?.details.ruleId=="15090")' audit.json
# -----------------------------------------------------------------------------
SecRule TX:MARKETGT_SEO_SCORE "@ge 1" \
    "id:15090,\
    phase:5,\
    pass,\
    t:none,\
    log,\
    auditlog,\
    msg:'MarketGT SEO | score=%{tx.marketgt_seo_score} umbral_entrante=%{tx.inbound_anomaly_score_threshold} bot_verificado=%{tx.marketgt_bot_verificado} ip=%{remote_addr} ua=%{request_headers.user-agent}',\
    tag:'reporting',\
    tag:'MARKETGT/SEO-REPORT',\
    ver:'MarketGT/1.1'"
