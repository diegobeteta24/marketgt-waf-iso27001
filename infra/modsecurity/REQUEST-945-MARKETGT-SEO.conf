# =============================================================================
# MarketGT - Reglas propias: ataques de SEO
# (SEO poisoning / spam injection / cloaking / negative SEO)
#
# CRS 4.29 NO trae reglas de SEO: no existe plugin oficial. Estas son reglas
# del proyecto, y eso es un punto a favor en la defensa: demuestran que el
# equipo sabe escribir SecRule, no solo encender un producto.
#
# NOMBRE DEL FICHERO: tiene que ordenarse DESPUES de REQUEST-944 y ANTES de
# REQUEST-949-BLOCKING-EVALUATION.conf, porque suma al score de anomalia que
# 949110 evalua. Por eso se llama REQUEST-945-*.
#
# IDs 15000-15999 = rango local (CRS usa 900000-999999).
# Puntuacion CRS:  critical=5  error=4  warning=3  notice=2
#                  umbral de bloqueo entrante = 5 (ANOMALY_INBOUND)
# =============================================================================


# -----------------------------------------------------------------------------
# 15000 - Inicializa el contador de SEO para que el reporte del fichero
#         RESPONSE-985 nunca imprima un valor vacio.
# -----------------------------------------------------------------------------
SecAction \
    "id:15000,\
    phase:1,\
    pass,\
    nolog,\
    setvar:'tx.marketgt_seo_score=0'"


# -----------------------------------------------------------------------------
# 15010 - SPAM INJECTION: inyeccion de enlaces/HTML de spam en campos de texto
#         de la tienda (descripcion de producto, resena, comentario, perfil).
#         Score critico: un solo acierto bloquea (5 >= umbral 5).
# -----------------------------------------------------------------------------
SecRule ARGS:descripcion|ARGS:description|ARGS:comentario|ARGS:comment|ARGS:resena|ARGS:review|ARGS:bio|ARGS:mensaje \
    "@rx (?i)<a\s[^>]*href\s*=|\[url\s*=|\bhttps?://[^\s\"'<>]+\.(?:ru|top|xyz|cn|tk|click|loan)\b" \
    "id:15010,\
    phase:2,\
    block,\
    capture,\
    t:none,t:urlDecodeUni,t:htmlEntityDecode,t:lowercase,\
    msg:'SEO Spam Injection: enlace externo inyectado en campo de contenido',\
    logdata:'Coincidencia: %{TX.0} en %{MATCHED_VAR_NAME}',\
    tag:'application-multi',\
    tag:'attack-seo',\
    tag:'MARKETGT/SEO-SPAM',\
    tag:'paranoia-level/1',\
    ver:'MarketGT/1.0',\
    severity:'CRITICAL',\
    multiMatch,\
    setvar:'tx.inbound_anomaly_score_pl1=+%{tx.critical_anomaly_score}',\
    setvar:'tx.marketgt_seo_score=+%{tx.critical_anomaly_score}'"


# -----------------------------------------------------------------------------
# 15011 - SEO POISONING: vocabulario clasico de spam farmaceutico/pirata
#         colocado en contenido indexable de la tienda.
# -----------------------------------------------------------------------------
SecRule ARGS|REQUEST_HEADERS:Referer \
    "@rx (?i)\b(?:buy\s+(?:cheap\s+)?(?:viagra|cialis|tramadol)|casino\s+online|free\s+download\s+crack|replica\s+(?:rolex|watches)|comprar\s+seguidores|backlinks?\s+(?:baratos|gratis))\b" \
    "id:15011,\
    phase:2,\
    block,\
    capture,\
    t:none,t:urlDecodeUni,t:htmlEntityDecode,t:lowercase,t:removeWhitespace,\
    msg:'SEO Poisoning: vocabulario de spam en contenido indexable',\
    logdata:'Coincidencia: %{TX.0} en %{MATCHED_VAR_NAME}',\
    tag:'application-multi',\
    tag:'attack-seo',\
    tag:'MARKETGT/SEO-POISONING',\
    tag:'paranoia-level/1',\
    ver:'MarketGT/1.0',\
    severity:'CRITICAL',\
    multiMatch,\
    setvar:'tx.inbound_anomaly_score_pl1=+%{tx.critical_anomaly_score}',\
    setvar:'tx.marketgt_seo_score=+%{tx.critical_anomaly_score}'"


# -----------------------------------------------------------------------------
# 15012 - CLOAKING: alguien se presenta como Googlebot desde una IP que no es
#         de Google. El cloaking consiste precisamente en servir contenido
#         distinto al buscador; detectar el Googlebot falso es el primer paso.
#         Rangos oficiales de Googlebot (googlebot.json, verificar cada semestre):
#         66.249.64.0/19, 34.100.182.96/28, 35.247.243.240/28, 2001:4860:4801::/48
# -----------------------------------------------------------------------------
SecRule REQUEST_HEADERS:User-Agent "@rx (?i)(?:googlebot|bingbot|duckduckbot|yandex(?:bot)?|baiduspider)" \
    "id:15012,\
    phase:1,\
    block,\
    capture,\
    t:none,\
    msg:'Cloaking / Bot falso: User-Agent de buscador desde IP no autorizada',\
    logdata:'UA: %{TX.0} desde %{REMOTE_ADDR}',\
    tag:'application-multi',\
    tag:'attack-seo',\
    tag:'attack-reputation-scanner',\
    tag:'MARKETGT/SEO-CLOAKING',\
    tag:'paranoia-level/1',\
    ver:'MarketGT/1.0',\
    severity:'CRITICAL',\
    chain"
    SecRule REMOTE_ADDR "!@ipMatch 66.249.64.0/19,34.100.182.96/28,35.247.243.240/28,157.55.39.0/24,40.77.167.0/24,20.15.133.0/24" \
        "setvar:'tx.inbound_anomaly_score_pl1=+%{tx.critical_anomaly_score}',\
        setvar:'tx.marketgt_seo_score=+%{tx.critical_anomaly_score}'"


# -----------------------------------------------------------------------------
# 15013 - CLOAKING por parametro: el atacante fuerza la vista de buscador
#         (?_escaped_fragment_=, ?googlebot=1, ?render=static).
# -----------------------------------------------------------------------------
SecRule ARGS_NAMES "@rx (?i)^(?:_escaped_fragment_|googlebot|__cloak|render_for_bot)$" \
    "id:15013,\
    phase:2,\
    block,\
    capture,\
    t:none,t:lowercase,\
    msg:'Cloaking: parametro de renderizado para buscador',\
    logdata:'Parametro: %{TX.0}',\
    tag:'application-multi',\
    tag:'attack-seo',\
    tag:'MARKETGT/SEO-CLOAKING',\
    ver:'MarketGT/1.0',\
    severity:'WARNING',\
    setvar:'tx.inbound_anomaly_score_pl1=+%{tx.warning_anomaly_score}',\
    setvar:'tx.marketgt_seo_score=+%{tx.warning_anomaly_score}'"


# -----------------------------------------------------------------------------
# 15014 - NEGATIVE SEO: intento de envenenar el sitemap/robots o de forzar
#         redirecciones abiertas hacia dominios de terceros (link farm).
# -----------------------------------------------------------------------------
SecRule REQUEST_URI "@rx (?i)^/(?:sitemap[^/]*\.xml|robots\.txt|\.well-known/)" \
    "id:15014,\
    phase:2,\
    block,\
    t:none,t:urlDecodeUni,t:lowercase,\
    msg:'Negative SEO: intento de escritura sobre artefactos de indexacion',\
    logdata:'%{REQUEST_METHOD} %{REQUEST_URI}',\
    tag:'application-multi',\
    tag:'attack-seo',\
    tag:'MARKETGT/SEO-NEGATIVE',\
    ver:'MarketGT/1.0',\
    severity:'CRITICAL',\
    chain"
    SecRule REQUEST_METHOD "@rx ^(?:POST|PUT|PATCH|DELETE)$" \
        "setvar:'tx.inbound_anomaly_score_pl1=+%{tx.critical_anomaly_score}',\
        setvar:'tx.marketgt_seo_score=+%{tx.critical_anomaly_score}'"


# -----------------------------------------------------------------------------
# 15015 - NEGATIVE SEO / redireccion abierta: ?redirect=, ?next=, ?url= hacia
#         un dominio externo. Es como se construyen las "doorway pages".
# -----------------------------------------------------------------------------
SecRule ARGS:redirect|ARGS:redirect_to|ARGS:next|ARGS:url|ARGS:return|ARGS:continue \
    "@rx (?i)^(?:https?:)?//(?!(?:www\.)?marketgt)" \
    "id:15015,\
    phase:2,\
    block,\
    capture,\
    t:none,t:urlDecodeUni,t:removeWhitespace,t:lowercase,\
    msg:'Negative SEO / Open Redirect hacia dominio externo',\
    logdata:'Destino: %{TX.0} en %{MATCHED_VAR_NAME}',\
    tag:'application-multi',\
    tag:'attack-seo',\
    tag:'MARKETGT/SEO-NEGATIVE',\
    ver:'MarketGT/1.0',\
    severity:'ERROR',\
    setvar:'tx.inbound_anomaly_score_pl1=+%{tx.error_anomaly_score}',\
    setvar:'tx.marketgt_seo_score=+%{tx.error_anomaly_score}'"


# -----------------------------------------------------------------------------
# 15090 - Resumen para el SIEM: deja el score de SEO en el audit log de cada
#         transaccion que haya disparado alguna de las reglas anteriores.
#         Se lee con: jq '.transaction.messages[] | select(.details.ruleId=="15090")'
# -----------------------------------------------------------------------------
SecRule TX:MARKETGT_SEO_SCORE "@ge 1" \
    "id:15090,\
    phase:5,\
    pass,\
    t:none,\
    log,\
    msg:'MarketGT SEO score: %{tx.marketgt_seo_score} (umbral entrante: %{tx.inbound_anomaly_score_threshold})',\
    tag:'reporting',\
    tag:'MARKETGT/SEO-REPORT',\
    ver:'MarketGT/1.0'"
