# =============================================================================
# MarketGT - NEGATIVE SEO: scraping masivo y flood de peticiones
#
# ---------------------------------------------------------------------------
# LEE ESTO ANTES DE MONTAR EL FICHERO
# ---------------------------------------------------------------------------
# Este fichero va en un MONTAJE APARTE del 945 a proposito. Usa colecciones
# PERSISTENTES de ModSecurity (initcol / setvar sobre IP: / expirevar), que es
# la parte de libmodsecurity v3 con mas historial de fallos. La imagen
# owasp/modsecurity-crs si trae LMDB compilado (el Dockerfile oficial compila
# LMDB y copia liblmdb.so al runtime), asi que deberia funcionar; pero si el
# sabado nginx no arranca, la solucion es UNA linea:
#
#     comenta el montaje de este fichero en infra/docker/docker-compose.yml
#     y vuelve a levantar. El resto del WAF sigue intacto.
#
# CONTROL PRIMARIO, EL QUE SI ES SEGURO: limit_req de nginx y la regla de
# rate limit de Cloudflare. Estan documentados en
# infra/nginx/laravel-detras-del-waf.md y NO dependen de LMDB.
# Estas reglas son la capa de DETECCION y de EVIDENCIA para el SIEM, no la
# unica defensa.
#
# IDs 15100-15199.
# ---------------------------------------------------------------------------

# NOTA SOBRE SecDefaultAction (corregido tras la verificacion adversarial).
#
# Aqui habia dos lineas SecDefaultAction, escritas bajo la premisa de que cada
# fichero del Core Rule Set declara el suyo. Esa premisa es FALSA: el Core Rule
# Set lo declara UNA sola vez, en crs-setup.conf, y la directiva es POSICIONAL,
# de modo que persiste a traves de los Include posteriores.
#
# La imagen reescribe esa linea para incluir tag:marketgt-waf. Al redeclararla
# aqui, TODO lo que carga despues perdia ese distintivo: el fichero 946, el 949
# (incluida la regla 949110, que es el evento de bloqueo que se muestra en el
# panel de monitoreo), el 999 y el 985. Los eventos seguian registrandose, pero
# sin la etiqueta con la que el panel los identifica.
#
# Las reglas de este fichero llevan pass en sus propias acciones, asi que
# ninguna bloquea por si sola: solo suman a la puntuacion de anomalia y la
# regla 949110 decide. Ese es el modelo del Core Rule Set y se conserva.

# -----------------------------------------------------------------------------
# 15100 - Abre la coleccion por IP. La clave incluye un hash del User-Agent
#         (tx.ua_hash lo calcula CRS en REQUEST-901-INITIALIZATION) para que un
#         NAT universitario compartido no acumule el contador de todos.
# -----------------------------------------------------------------------------
SecAction \
    "id:15100,\
    phase:1,\
    pass,\
    nolog,\
    initcol:ip=%{remote_addr}_%{tx.ua_hash},\
    setvar:'tx.marketgt_scraping_score=0'"

# -----------------------------------------------------------------------------
# 15110 - HEURISTICA DE SCRAPER: peticion GET a una pagina de catalogo, SIN
#         cookie de sesion. Un navegador real recoge la cookie en la primera
#         respuesta y la devuelve en la segunda; un scraper con requests o curl
#         normalmente no. Contamos solo estas: asi un cliente real navegando
#         rapido NUNCA entra en el contador.
#
#         Ajusta la ruta ^/(productos|catalogo|tienda|p)/ a las rutas reales.
#
#         EXENCION OBLIGATORIA DEL RASTREADOR LEGITIMO (corregido tras la
#         verificacion adversarial). La heuristica de «no manda cookie» describe
#         con exactitud a Googlebot: por diseño no acepta ni devuelve cookies,
#         y recorre el catalogo entero mas rapido que cualquier persona. Sin
#         esta exencion, la primera visita seria del rastreador de Google, que
#         acabaria con 403 y en cuarentena 300 segundos.
#
#         El resultado seria exactamente la desindexacion que este proyecto
#         presume de prevenir en el fichero 945: el mismo daño al posicionamiento
#         que decimos combatir, causado por nuestro propio control. Es el tipo
#         de hallazgo que un auditor busca, y con razon.
#
#         La variable TX:MARKETGT_BOT_VERIFICADO la fija la regla 15020 del
#         fichero 945, que compara la direccion contra los rangos publicados
#         por los buscadores. Solo se cuenta a quien NO esta verificado.
# -----------------------------------------------------------------------------
SecRule TX:MARKETGT_BOT_VERIFICADO "@eq 0" \
    "id:15110,\
    phase:1,\
    pass,\
    nolog,\
    t:none,\
    ver:'MarketGT/1.2',\
    chain"
    SecRule REQUEST_METHOD "@streq GET" \
        "t:none,chain"
        SecRule REQUEST_FILENAME "@rx (?i)^/(?:productos|catalogo|tienda|p|producto)(?:/|$)" \
            "t:none,t:normalizePath,chain"
            SecRule &REQUEST_HEADERS:Cookie "@eq 0" \
                "setvar:'ip.marketgt_catalogo_hits=+1',\
                expirevar:'ip.marketgt_catalogo_hits=60'"

# -----------------------------------------------------------------------------
# 15111 - UMBRAL: mas de 40 paginas de catalogo sin sesion en 60 segundos.
#         Un humano no lo hace. Un scraper duplicando tu catalogo para clonarlo
#         en otro dominio, si: ese es el negative SEO de contenido duplicado.
#
#         40/60s es deliberadamente generoso para no reventar la demo.
#         En produccion real, 15-20 es lo razonable.
# -----------------------------------------------------------------------------
SecRule IP:MARKETGT_CATALOGO_HITS "@gt 40" \
    "id:15111,\
    phase:1,\
    block,\
    t:none,\
    msg:'Negative SEO: scraping agresivo del catalogo (%{ip.marketgt_catalogo_hits} paginas sin sesion en 60 s)',\
    logdata:'IP: %{remote_addr} | UA: %{request_headers.user-agent}',\
    tag:'application-multi',\
    tag:'attack-seo',\
    tag:'MARKETGT/SEO-SCRAPING',\
    tag:'paranoia-level/1',\
    tag:'iso27001/A.8.23',\
    tag:'owasp-top10-2025/A01',\
    ver:'MarketGT/1.1',\
    severity:'CRITICAL',\
    setvar:'ip.marketgt_bloqueo_scraping=1',\
    expirevar:'ip.marketgt_bloqueo_scraping=300',\
    setvar:'tx.inbound_anomaly_score_pl1=+%{tx.critical_anomaly_score}',\
    setvar:'tx.marketgt_seo_score=+%{tx.critical_anomaly_score}'"

# -----------------------------------------------------------------------------
# 15112 - CUARENTENA: una vez marcado, la IP queda bloqueada 300 s aunque baje
#         el ritmo. Sin esto el scraper solo tiene que esperar a que expire el
#         contador de 60 s y seguir. Es el mismo patron que usa el plugin
#         oficial dos-protection-plugin-modsecurity de CRS.
# -----------------------------------------------------------------------------
SecRule IP:MARKETGT_BLOQUEO_SCRAPING "@eq 1" \
    "id:15112,\
    phase:1,\
    block,\
    t:none,\
    msg:'Negative SEO: IP en cuarentena por scraping (quedan hasta 300 s)',\
    logdata:'IP: %{remote_addr}',\
    tag:'application-multi',\
    tag:'attack-seo',\
    tag:'MARKETGT/SEO-SCRAPING',\
    ver:'MarketGT/1.1',\
    severity:'CRITICAL',\
    setvar:'tx.inbound_anomaly_score_pl1=+%{tx.critical_anomaly_score}',\
    setvar:'tx.marketgt_seo_score=+%{tx.critical_anomaly_score}'"

# -----------------------------------------------------------------------------
# 15120 - HERRAMIENTA DE CLONADO DE SITIOS declarada en el User-Agent.
#         httrack, wget -m, SiteSucker y compania existen para duplicar un sitio
#         entero. CRS 913100 cubre escaneres de seguridad (sqlmap, nikto), NO
#         cubre estos: son herramientas legitimas usadas con mal fin.
#
#         OJO: 'curl' y 'python-requests' NO estan en la lista a proposito.
#         Los usan las sondas de estado, los health checks y nuestro propio
#         guion de demostracion. Bloquearlos rompe mas de lo que arregla.
# -----------------------------------------------------------------------------
SecRule REQUEST_HEADERS:User-Agent \
    "@rx (?i)(?:httrack|webcopier|webzip|teleport\s*pro|offline\s*explorer|sitesucker|website\s*ripper|wget/|curl-clone|scrapy|node-fetch|puppeteer|playwright|selenium|headlesschrome|crawler4j|apache-httpclient|okhttp|go-http-client|libwww-perl|python-urllib)" \
    "id:15120,\
    phase:1,\
    block,\
    capture,\
    t:none,\
    msg:'Negative SEO: herramienta de clonado o automatizacion declarada en el User-Agent',\
    logdata:'UA: %{TX.0} | IP: %{remote_addr}',\
    tag:'application-multi',\
    tag:'attack-seo',\
    tag:'attack-reputation-crawler',\
    tag:'MARKETGT/SEO-SCRAPING',\
    tag:'paranoia-level/1',\
    tag:'iso27001/A.8.23',\
    ver:'MarketGT/1.1',\
    severity:'ERROR',\
    setvar:'tx.inbound_anomaly_score_pl1=+%{tx.error_anomaly_score}',\
    setvar:'tx.marketgt_seo_score=+%{tx.error_anomaly_score}'"

# -----------------------------------------------------------------------------
# 15121 - SCRAPER SIN HUELLA DE NAVEGADOR: dice ser Mozilla pero no manda
#         Accept-Language ni Accept-Encoding. Todo navegador real manda ambos.
#         Es la firma de un requests.get() al que solo le cambiaron el UA.
#         WARNING (+3): por si solo no bloquea; suma con otra senal.
# -----------------------------------------------------------------------------
SecRule REQUEST_HEADERS:User-Agent "@rx (?i)mozilla" \
    "id:15121,\
    phase:1,\
    pass,\
    t:none,\
    msg:'Scraper probable: User-Agent de navegador sin cabeceras Accept-Language ni Accept-Encoding',\
    logdata:'UA: %{request_headers.user-agent} | IP: %{remote_addr}',\
    tag:'application-multi',\
    tag:'attack-seo',\
    tag:'MARKETGT/SEO-SCRAPING',\
    ver:'MarketGT/1.1',\
    severity:'WARNING',\
    chain"
    SecRule &REQUEST_HEADERS:Accept-Language "@eq 0" \
        "chain"
        SecRule &REQUEST_HEADERS:Accept-Encoding "@eq 0" \
            "setvar:'tx.inbound_anomaly_score_pl1=+%{tx.warning_anomaly_score}',\
            setvar:'tx.marketgt_seo_score=+%{tx.warning_anomaly_score}'"
